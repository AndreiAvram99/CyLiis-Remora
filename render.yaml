# Render blueprint: 1 Postgres, 1 Web Service (dashboard), 1 Background Worker.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: discord-cal-db
    databaseName: discordcal
    plan: basic-256mb

envVarGroups:
  - name: discord-cal-shared
    envVars:
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DEFAULT_TIMEZONE
        value: Europe/Bucharest
      # Channel where "Motivation" (excused absence) reasons are posted. The bot
      # looks it up by name; set APOLOGY_CHANNEL_ID to target a specific channel.
      - key: APOLOGY_CHANNEL_NAME
        value: chat-de-scuze
      - key: APOLOGY_CHANNEL_ID
        sync: false
      - key: MANAGER_ROLE_NAME
        value: Remora-Admin
      - key: MANAGER_ROLE_ID
        sync: false
      # The one owner account: deletes schedules, adjusts marks, edits expected
      # attendees. Empty means no owner at all.
      - key: MASTER_DISCORD_ID
        sync: false
      # Role shortcuts offered when picking a meeting's expected attendees, by
      # id and/or by name. Empty means members only, no role chips.
      - key: ATTENDEE_ROLE_IDS
        sync: false
      - key: ATTENDEE_ROLE_NAMES
        sync: false
      # Who may schedule into #announcements. Empty falls back to the role
      # named "Announcements".
      - key: ANNOUNCEMENTS_ROLE_ID
        sync: false
      # Channel names offered in the picker. Empty offers every text channel.
      - key: CHANNEL_ALLOWLIST
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      # Optional: push each schedule type to its own calendar. Falls back to
      # GOOGLE_CALENDAR_ID when a per-kind id is not set.
      - key: GOOGLE_CALENDAR_ID_MEETING
        sync: false
      - key: GOOGLE_CALENDAR_ID_EVENT
        sync: false
      - key: GOOGLE_CALENDAR_ID_CUSTOM
        sync: false
      - key: GOOGLE_CALENDAR_ENABLED
        value: "true"
      # Drive folder holding the per-team minutes folders that meeting agendas
      # are filed into. Without it, the Agenda button reports it isn't set up.
      - key: GOOGLE_AGENDA_FOLDER_ID
        sync: false

services:
  - type: web
    name: cyremora
    runtime: node
    plan: starter
    # --include=dev so prisma / typescript / next are available at build time
    # even though NODE_ENV=production.
    buildCommand: npm install --include=dev && npm run build:dashboard
    preDeployCommand: npm run db:deploy && npm run db:seed
    startCommand: npm run start:dashboard
    healthCheckPath: /api/health
    envVars:
      - fromGroup: discord-cal-shared
      - key: DATABASE_URL
        fromDatabase:
          name: discord-cal-db
          property: connectionString
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: ADMIN_DISCORD_IDS
        sync: false
      - key: NODE_ENV
        value: production

  - type: worker
    name: discord-cal-worker
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build:worker
    startCommand: npm run start:worker
    envVars:
      - fromGroup: discord-cal-shared
      - key: DATABASE_URL
        fromDatabase:
          name: discord-cal-db
          property: connectionString
      - key: REMINDER_POLL_SECONDS
        value: "30"
      - key: NODE_ENV
        value: production
